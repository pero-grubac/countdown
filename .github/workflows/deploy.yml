name: Deploy

on:
  # Runs after CI has passed on main, so the tests aren't run twice.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI just tested (workflow_run), otherwise the current one.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest service-worker.js favicon.svg js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
